; PAR settings - edit with Notepad, then type  .par reload  in EuroScope
[PAR]
; Runway opened at start, "ICAO RWY" (must exist in PAR_Runways.csv). Empty = none.
Runway=
; Scope range in NM (2 - 20)
RangeNM=10
; Azimuth scope: half-height in metres (the centreline is in the middle)
AzHalfM=500
; Elevation scope: half-height in feet (the glidepath is in the middle)
ElHalfFt=500
; QNH used to correct the aircraft pressure altitude (change live with .par qnh 1015)
QNH=1013
; Decision height above the threshold, ft (an orange DH line is drawn on the elevation scope)
DecisionHeightFt=200
; 1 = window stays above everything (including EuroScope), 0 = normal window
TopMost=1
; 1 = also show other traffic in the approach cone (dimmed), 0 = only the tracked aircraft (change live with .par others)
ShowOthers=0
